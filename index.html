<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeFit - AI 체형 분석 스타일 추천</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6073295964667681" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">VibeFit</h1>
            <button id="theme-toggle" class="theme-toggle">☀️</button>
        </header>
        <main>
            <section class="hero">
                <h2>AI가 당신의 체형을 분석하고<br>완벽한 스타일을 추천해드려요</h2>
                <div class="upload-box">
                    <p>여기에 셀카 사진을 드래그 앤 드롭하세요</p>
                    <span>또는</span>
                    <button class="upload-btn">파일 선택</button>
                </div>
                <button class="cta-button">지금 무료로 분석받기</button>
            </section>
            <section class="features">
                <div class="feature">
                    <h3>AI 체형 분석</h3>
                    <p>사진 한 장으로 당신의 체형을<br>정확하게 분석합니다.</p>
                </div>
                <div class="feature">
                    <h3>맞춤 스타일 추천</h3>
                    <p>분석된 체형 데이터를 기반으로<br>최고의 스타일을 제안합니다.</p>
                </div>
                <div class="feature">
                    <h3>가상 피팅</h3>
                    <p>추천받은 옷을 가상으로<br>입어볼 수 있습니다.</p>
                </div>
                <div class="feature">
                    <a href="https://www.musinsa.com/main/musinsa/recommend?gf=A" target="_blank" rel="noopener noreferrer" style="text-decoration: none; color: inherit;">
                        <h3>쇼핑몰 연동</h3>
                        <p>마음에 드는 옷을 바로<br>구매할 수 있습니다.</p>
                    </a>
                </div>
            </section>

            <section class="contact-section">
                <h2>제휴 문의</h2>
                <p>VibeFit과 함께 성장할 파트너를 기다립니다.</p>
                <form action="https://formspree.io/f/mzdwaqzp" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="name">이름</label>
                        <input type="text" name="name" id="name" required placeholder="성함을 입력해주세요">
                    </div>
                    <div class="form-group">
                        <label for="email">이메일</label>
                        <input type="email" name="email" id="email" required placeholder="이메일 주소를 입력해주세요">
                    </div>
                    <div class="form-group">
                        <label for="message">문의 내용</label>
                        <textarea name="message" id="message" rows="5" required placeholder="문의 내용을 입력해주세요"></textarea>
                    </div>
                    <button type="submit" class="cta-button contact-submit-btn">문의 보내기</button>
                </form>
            </section>

            <section class="disqus-section">
                <div id="disqus_thread"></div>
            </section>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
